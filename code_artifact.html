<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《岳陽樓記》背默練習</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Traditional Chinese Serif and Calligraphy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Serif TC', STKaiti, KaiTi, serif;
            user-select: none;
            background-color: #12100e;
            color: #2c2520;
            overflow-x: hidden;
        }

        .font-calligraphy {
            font-family: 'Ma Shan Zheng', 'Noto Serif TC', cursive;
        }

        /* --- Paragraph Specific Background Themes --- */
        /* Para 3: Sunny Sparkling Lake (晴天湖面美麗景致) */
        .bg-para-3 {
            background: linear-gradient(135deg, rgba(245, 247, 235, 0.90), rgba(200, 225, 215, 0.92)),
                        radial-gradient(circle at 50% 20%, rgba(255, 240, 180, 0.4), transparent 60%),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        }

        /* Para 4: Overcast Stormy Cloud Lake (陰天灰暗水墨天色) */
        .bg-para-4 {
            background: linear-gradient(135deg, rgba(180, 190, 200, 0.92), rgba(100, 115, 130, 0.95)),
                        radial-gradient(circle at 50% 30%, rgba(50, 60, 70, 0.5), transparent 70%),
                        url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        }

        /* Para 5: Yueyang Tower Silhouette (岳陽樓樓閣飛簷古典背景) */
        .bg-para-5 {
            background: linear-gradient(135deg, rgba(245, 235, 215, 0.92), rgba(205, 180, 140, 0.95)),
                        radial-gradient(circle at 50% 20%, rgba(212, 163, 89, 0.3), transparent 60%),
                        url('https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        }

        /* Wood Plaque Style (木質匾額質感) */
        .wood-tile {
            background: linear-gradient(145deg, #a66a38, #7a4a21);
            border: 2px solid #5c3515;
            box-shadow: inset 1px 1px 3px rgba(255, 255, 255, 0.3), inset -2px -2px 4px rgba(0,0,0,0.6), 2px 3px 6px rgba(0,0,0,0.3);
            color: #fceabb;
            text-shadow: 1px 1px 2px #3d1e08;
            border-radius: 6px;
        }

        /* Stone Tile Style (古樸青石板質感) */
        .stone-tile {
            background: linear-gradient(145deg, #4b5563, #2d3748);
            border: 2px solid #1a202c;
            box-shadow: inset 1px 1px 3px rgba(255, 255, 255, 0.2), inset -2px -2px 4px rgba(0,0,0,0.7), 2px 3px 6px rgba(0,0,0,0.3);
            color: #f6e05e;
            text-shadow: 1px 1px 2px #000;
            border-radius: 6px;
        }

        /* Empty Rice Paper Slot */
        .slot-empty {
            background: rgba(245, 238, 220, 0.7);
            border: 2px dashed #8c7b6b;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.12);
            color: transparent;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .slot-active {
            border: 2px solid #c0392b !important;
            background: rgba(255, 252, 240, 0.95) !important;
            box-shadow: 0 0 12px rgba(192, 57, 43, 0.7) !important;
            transform: scale(1.08);
        }

        /* Static Punctuation Badge */
        .punct-node {
            color: #36281e;
            font-weight: 900;
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
        }

        /* Seal Stamp Effect */
        .seal-stamp {
            border: 4px double #b32400;
            color: #b32400;
            font-family: 'Ma Shan Zheng', cursive;
            padding: 6px 18px;
            border-radius: 8px;
            transform: rotate(-10deg);
            display: inline-block;
            box-shadow: 0 0 6px rgba(179, 36, 0, 0.35);
            background: rgba(255, 248, 242, 0.9);
            animation: stampBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes stampBounce {
            0% { transform: scale(2.8) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(-10deg); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between transition-all duration-700 bg-para-3" id="app-body">

    <!-- Top Navigation & Timer Bar -->
    <header class="w-full bg-stone-900/90 text-amber-100 backdrop-blur-md border-b-2 border-amber-800/50 px-4 py-3 flex flex-wrap justify-between items-center z-20 shadow-lg">
        <div class="flex items-center space-x-3">
            <button id="nav-btn-home" class="hover:text-amber-400 transition flex items-center gap-1.5 bg-amber-900/50 hover:bg-amber-800/70 px-3.5 py-1.5 rounded-lg border border-amber-700/60 text-sm font-bold">
                <i class="fa-solid fa-house"></i> 返回主頁
            </button>
            <h1 class="text-xl md:text-2xl font-bold font-calligraphy tracking-widest text-amber-200">
                《岳陽樓記》背默練習
            </h1>
        </div>

        <!-- Timer & Controls Section -->
        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <div class="flex items-center space-x-2 bg-black/60 px-3 py-1.5 rounded-full border border-amber-600/40">
                <i class="fa-solid fa-hourglass-half text-amber-400 animate-pulse"></i>
                <span id="timer-display" class="font-mono text-lg font-bold text-amber-300">25:00</span>
                <button id="btn-timer-toggle" class="text-xs text-amber-200 hover:text-white px-1">
                    <i id="timer-icon" class="fa-solid fa-pause"></i>
                </button>
                <button id="btn-timer-reset" class="text-xs text-amber-400 hover:text-white px-1">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <span id="mode-badge" class="hidden sm:inline-block bg-amber-800/60 text-amber-200 text-xs px-2.5 py-1 rounded border border-amber-600/40">
                順序背誦模式
            </span>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-5xl flex flex-col justify-center items-center z-10">

        <!-- ================= HOME SCREEN ================= -->
        <section id="screen-home" class="w-full max-w-2xl bg-amber-50/95 backdrop-blur-md rounded-2xl p-6 sm:p-10 shadow-2xl border-4 border-amber-900/40 text-center relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 opacity-10 text-stone-900 text-9xl font-calligraphy pointer-events-none">
                岳樓
            </div>
            <h2 class="text-3xl sm:text-4xl font-bold font-calligraphy text-amber-950 mb-3 tracking-wider">
                《岳陽樓記》背默練習
            </h2>
            <p class="text-stone-700 text-sm sm:text-base mb-8 max-w-md mx-auto leading-relaxed">
                涵蓋范仲淹名篇（第3至第5段）。請選擇模式，於25分鐘內憑記憶輸入正確漢字，標點符號已預先為您排版。
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
                <!-- Mode 1: Sequential -->
                <button id="btn-mode-seq" class="group relative bg-gradient-to-br from-amber-800 to-stone-800 hover:from-amber-700 hover:to-stone-700 text-amber-100 p-6 rounded-xl border-2 border-amber-600/50 shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center text-left">
                    <div class="w-12 h-12 bg-amber-600/30 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-stairs text-amber-300 text-xl"></i>
                    </div>
                    <span class="text-xl font-bold font-calligraphy text-amber-200 mb-1">順序背誦模式</span>
                    <span class="text-xs text-amber-300/80 leading-snug">從第3段開始，依次挑戰第3段、第4段及第5段。</span>
                </button>

                <!-- Mode 2: Free Selection -->
                <button id="btn-mode-free" class="group relative bg-gradient-to-br from-stone-800 to-amber-900 hover:from-stone-700 hover:to-amber-800 text-amber-100 p-6 rounded-xl border-2 border-amber-600/50 shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center text-left">
                    <div class="w-12 h-12 bg-amber-600/30 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-list-check text-amber-300 text-xl"></i>
                    </div>
                    <span class="text-xl font-bold font-calligraphy text-amber-200 mb-1">自選段落模式</span>
                    <span class="text-xs text-amber-300/80 leading-snug">自主選擇第3段、第4段或第5段進行單獨背誦練習。</span>
                </button>
            </div>

            <!-- Sub Paragraph Selector (Hidden by default) -->
            <div id="para-select-box" class="hidden bg-amber-100/90 p-4 rounded-xl border border-amber-300/80 mb-4 animate-fade-in">
                <p class="text-xs text-amber-900 font-bold mb-2">請選擇欲背誦之段落：</p>
                <div class="flex justify-center gap-2 flex-wrap">
                    <button id="btn-para-0" class="bg-amber-800 hover:bg-amber-700 text-amber-100 px-3 py-1.5 rounded-lg text-sm font-calligraphy shadow">第三段：若夫霪雨霏霏</button>
                    <button id="btn-para-1" class="bg-amber-800 hover:bg-amber-700 text-amber-100 px-3 py-1.5 rounded-lg text-sm font-calligraphy shadow">第四段：至若春和景明</button>
                    <button id="btn-para-2" class="bg-amber-800 hover:bg-amber-700 text-amber-100 px-3 py-1.5 rounded-lg text-sm font-calligraphy shadow">第五段：嗟夫！予嘗求</button>
                </div>
            </div>
        </section>

        <!-- ================= GAME PLAY INTERFACE ================= -->
        <section id="screen-game" class="hidden w-full flex flex-col items-center">
            
            <!-- Header Level Banner -->
            <div class="w-full bg-stone-900/85 backdrop-blur-md rounded-xl p-4 mb-4 border border-amber-700/50 shadow-xl flex flex-wrap justify-between items-center text-amber-100">
                <div class="flex items-center space-x-3">
                    <span id="level-tag" class="bg-amber-700 text-amber-100 text-xs px-3 py-1 rounded-full font-bold">
                        關卡 1 / 3
                    </span>
                    <h3 id="para-title" class="text-lg sm:text-2xl font-bold font-calligraphy text-amber-200">
                        【第三段】若夫霪雨霏霏
                    </h3>
                </div>
                
                <div class="flex items-center space-x-4 mt-2 sm:mt-0 text-sm">
                    <div class="text-stone-300">
                        正確率: <span id="accuracy-rate" class="text-amber-400 font-bold">100%</span>
                    </div>
                    <div class="w-28 bg-stone-700 rounded-full h-2.5 overflow-hidden border border-stone-600">
                        <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Character Grid Box (Wood Plank / Stone Slate Container) -->
            <div class="w-full bg-amber-50/90 backdrop-blur-md rounded-2xl p-4 sm:p-8 border-4 border-amber-900/40 shadow-2xl mb-6 min-h-[300px]">
                <div id="character-grid" class="flex flex-wrap gap-1.5 sm:gap-2.5 justify-center items-center leading-relaxed">
                    <!-- Dynamic Blocks Generated Here -->
                </div>
            </div>

            <!-- Input Controls -->
            <div class="w-full max-w-xl bg-stone-900/90 backdrop-blur-md rounded-2xl p-4 border-2 border-amber-600/50 shadow-2xl flex flex-col sm:flex-row gap-3 items-center">
                <div class="relative w-full">
                    <input type="text" id="user-text-input" autocomplete="off" placeholder="點擊此處按順序輸入漢字..." 
                        class="w-full bg-stone-800 text-amber-100 border-2 border-amber-700/60 rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-400 text-center text-lg placeholder-stone-500 font-serif">
                </div>
                <div class="flex gap-2 w-full sm:w-auto shrink-0 justify-center">
                    <button id="btn-action-hint" class="bg-amber-700 hover:bg-amber-600 text-amber-100 px-3 py-2 rounded-xl text-sm font-bold shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-lightbulb text-yellow-300"></i> 提示
                    </button>
                    <button id="btn-action-reset" class="bg-stone-700 hover:bg-stone-600 text-stone-200 px-3 py-2 rounded-xl text-sm shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> 重填
                    </button>
                    <button id="btn-action-peek" class="bg-amber-900 hover:bg-amber-800 text-amber-200 px-3 py-2 rounded-xl text-sm shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> 查看原文
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- ================= STAGE TRANSITION FLOATING BANNER ================= -->
    <div id="modal-transition" class="fixed inset-0 bg-black/80 backdrop-blur-lg flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="bg-amber-50 rounded-2xl p-8 max-w-lg mx-4 text-center border-4 border-amber-800 shadow-2xl relative transform scale-95 transition-transform duration-500" id="transition-card">
            <div class="mb-3 text-amber-800 text-4xl">
                <i class="fa-solid fa-stamp"></i>
            </div>
            <h3 id="transition-title" class="text-2xl sm:text-3xl font-bold font-calligraphy text-amber-950 mb-2">
                恭喜成功背誦本段！
            </h3>
            <p id="transition-sub" class="text-stone-700 text-sm sm:text-base mb-6 leading-relaxed">
                熟讀成誦，妙筆生花。即將進入下一段...
            </p>
            <div id="transition-seal" class="seal-stamp text-xl font-bold mb-2">
                熟能生巧
            </div>
        </div>
    </div>

    <!-- ================= FULL TEXT PEEK MODAL ================= -->
    <div id="modal-peek" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-amber-50 rounded-2xl p-6 max-w-xl mx-4 border-2 border-amber-800 shadow-2xl">
            <h4 class="text-xl font-bold font-calligraphy text-amber-950 mb-3 text-center">【當前段落原文】</h4>
            <p id="peek-content" class="text-stone-800 text-lg leading-relaxed font-serif p-4 bg-amber-100/60 rounded-xl border border-amber-300">
                <!-- Text inserted dynamically -->
            </p>
            <div class="text-center mt-4">
                <button id="btn-close-peek" class="bg-amber-800 hover:bg-amber-700 text-amber-100 px-6 py-2 rounded-xl text-sm font-bold shadow">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Game Raw Paragraph Data ---
        const PARAGRAPHS = [
            {
                id: 3,
                title: "【第三段】若夫霪雨霏霏",
                bgClass: "bg-para-3",
                text: "若夫霪雨霏霏，連月不開；陰風怒號，濁浪排空；日星隱耀，山岳潛形；商旅不行，檣傾楫摧；薄暮冥冥，虎嘯猿啼。登斯樓也，則有去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲者矣。"
            },
            {
                id: 4,
                title: "【第四段】至若春和景明",
                bgClass: "bg-para-4",
                text: "至若春和景明，波瀾不驚，上下天光，一碧萬頃；沙鷗翔集，錦鱗游泳，岸芷汀蘭，郁郁青青。而或長煙一空，皓月千里，浮光躍金，靜影沉璧；漁歌互答，此樂何極﹗登斯樓也，則有心曠神怡，寵辱皆忘，把酒臨風，其喜洋洋者矣。"
            },
            {
                id: 5,
                title: "【第五段】嗟夫！予嘗求古仁人之心",
                bgClass: "bg-para-5",
                text: "嗟夫！予嘗求古仁人之心，或異二者之為。何哉？不以物喜，不以己悲。居廟堂之高，則憂其民；處江湖之遠，則憂其君。是進亦憂，退亦憂，然則何時而樂耶？其必曰：「先天下之憂而憂，後天下之樂而樂」歟！噫！微斯人，吾誰與歸﹗"
            }
        ];

        const PUNCTUATION_SET = new Set(['，', '；', '！', '。', '「', '」', '﹗', '？', '：']);

        // --- Application State ---
        let currentMode = 'sequential'; // 'sequential' | 'free'
        let currentParaIdx = 0;
        let parsedTokens = [];
        let charIndices = [];
        let activeCharPointer = 0;
        let totalMistakes = 0;

        // Timer State (25 Minutes)
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let isTimerRunning = false;

        // Explicitly bind logic on DOMContentLoaded to guarantee zero button freezing
        document.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
            updateTimerDisplay();
        });

        function initEventListeners() {
            // Navigation
            document.getElementById('nav-btn-home').onclick = showHomeScreen;

            // Timer Buttons
            document.getElementById('btn-timer-toggle').onclick = toggleTimer;
            document.getElementById('btn-timer-reset').onclick = resetTimer;

            // Home Screen Mode Selection Buttons
            document.getElementById('btn-mode-seq').onclick = () => startGameMode('sequential');
            document.getElementById('btn-mode-free').onclick = toggleParagraphSelectModal;

            // Paragraph Sub-buttons
            document.getElementById('btn-para-0').onclick = () => startGameMode('free', 0);
            document.getElementById('btn-para-1').onclick = () => startGameMode('free', 1);
            document.getElementById('btn-para-2').onclick = () => startGameMode('free', 2);

            // In-game Action Buttons
            document.getElementById('btn-action-hint').onclick = triggerHint;
            document.getElementById('btn-action-reset').onclick = resetCurrentParagraph;
            document.getElementById('btn-action-peek').onclick = togglePeekModal;
            document.getElementById('btn-close-peek').onclick = togglePeekModal;

            // Text input handling
            setupInputListener();
        }

        // --- Timer Controls ---
        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timer-icon').className = 'fa-solid fa-play';
            } else {
                startTimer();
                document.getElementById('timer-icon').className = 'fa-solid fa-pause';
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    alert("⏰ 25分鐘時間到！請檢查背默進度，重新加油！");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 25 * 60;
            updateTimerDisplay();
            document.getElementById('timer-icon').className = 'fa-solid fa-play';
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer-display').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // --- Screen & Navigation Logic ---
        function showHomeScreen() {
            document.getElementById('screen-home').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('para-select-box').classList.add('hidden');
        }

        function toggleParagraphSelectModal() {
            const selectBox = document.getElementById('para-select-box');
            selectBox.classList.toggle('hidden');
        }

        function startGameMode(mode, paraIdx = 0) {
            currentMode = mode;
            currentParaIdx = paraIdx;

            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');

            document.getElementById('mode-badge').textContent = 
                mode === 'sequential' ? '順序背誦模式' : '自選段落模式';

            if (!isTimerRunning) {
                startTimer();
            }

            loadParagraph(currentParaIdx);
        }

        function loadParagraph(idx) {
            currentParaIdx = idx;
            const data = PARAGRAPHS[idx];

            // 1. Switch Theme Background
            const body = document.getElementById('app-body');
            body.className = `min-h-screen flex flex-col justify-between transition-all duration-700 ${data.bgClass}`;

            // 2. Set Header Info
            document.getElementById('para-title').textContent = data.title;
            document.getElementById('level-tag').textContent = `關卡 ${idx + 1} / 3`;
            document.getElementById('peek-content').textContent = data.text;

            // 3. Parse Character and Punctuation Tokens
            parsedTokens = [];
            charIndices = [];

            const rawChars = data.text.split('');
            rawChars.forEach((ch) => {
                if (PUNCTUATION_SET.has(ch)) {
                    parsedTokens.push({ type: 'punct', char: ch });
                } else {
                    const tokenIdx = parsedTokens.length;
                    parsedTokens.push({ type: 'char', char: ch, userTyped: '', solved: false });
                    charIndices.push(tokenIdx);
                }
            });

            activeCharPointer = 0;
            totalMistakes = 0;
            document.getElementById('accuracy-rate').textContent = '100%';

            renderGrid();
            focusInput();
        }

        function renderGrid() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            parsedTokens.forEach((token, idx) => {
                if (token.type === 'punct') {
                    const span = document.createElement('span');
                    span.className = 'punct-node';
                    span.textContent = token.char;
                    grid.appendChild(span);
                } else {
                    const div = document.createElement('div');
                    div.id = `block-${idx}`;
                    div.style.width = '2.4rem';
                    div.style.height = '2.4rem';
                    div.className = 'flex items-center justify-center font-bold text-lg cursor-pointer transition-all duration-200 ';

                    // Wood and stone alternating design
                    const isWood = (idx % 2 === 0);

                    if (token.solved) {
                        div.className += isWood ? 'wood-tile' : 'stone-tile';
                        div.textContent = token.char;
                    } else {
                        div.className += 'slot-empty';
                        div.textContent = token.userTyped || '';
                    }

                    // Active pointer highlight
                    const activeTokenIdx = charIndices[activeCharPointer];
                    if (idx === activeTokenIdx) {
                        div.classList.add('slot-active');
                    }

                    div.onclick = () => {
                        const ptr = charIndices.indexOf(idx);
                        if (ptr !== -1) {
                            activeCharPointer = ptr;
                            renderGrid();
                            focusInput();
                        }
                    };

                    grid.appendChild(div);
                }
            });

            updateProgress();
        }

        function setupInputListener() {
            const input = document.getElementById('user-text-input');

            input.addEventListener('input', (e) => {
                const typedVal = e.target.value.trim();
                if (!typedVal) return;

                for (let i = 0; i < typedVal.length; i++) {
                    const char = typedVal[i];
                    if (PUNCTUATION_SET.has(char)) continue;

                    if (activeCharPointer < charIndices.length) {
                        const tokenIdx = charIndices[activeCharPointer];
                        const targetToken = parsedTokens[tokenIdx];

                        if (char === targetToken.char) {
                            targetToken.solved = true;
                            targetToken.userTyped = char;
                            activeCharPointer++;
                        } else {
                            totalMistakes++;
                            targetToken.userTyped = char;
                            shakeBlock(tokenIdx);
                        }
                    }
                }

                input.value = '';
                updateAccuracy();
                renderGrid();

                if (activeCharPointer >= charIndices.length) {
                    checkParagraphCompletion();
                }
            });
        }

        function focusInput() {
            const input = document.getElementById('user-text-input');
            input.focus();
        }

        function shakeBlock(tokenIdx) {
            const el = document.getElementById(`block-${tokenIdx}`);
            if (el) {
                el.classList.add('bg-red-300', 'border-red-600', 'animate-bounce');
                setTimeout(() => {
                    el.classList.remove('bg-red-300', 'border-red-600', 'animate-bounce');
                }, 400);
            }
        }

        function updateProgress() {
            const total = charIndices.length;
            const solved = activeCharPointer;
            const percentage = Math.round((solved / total) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function updateAccuracy() {
            const totalAttempts = activeCharPointer + totalMistakes;
            if (totalAttempts === 0) return;
            const acc = Math.max(0, Math.round((activeCharPointer / totalAttempts) * 100));
            document.getElementById('accuracy-rate').textContent = `${acc}%`;
        }

        function triggerHint() {
            if (activeCharPointer < charIndices.length) {
                const tokenIdx = charIndices[activeCharPointer];
                const token = parsedTokens[tokenIdx];
                token.solved = true;
                token.userTyped = token.char;
                activeCharPointer++;
                renderGrid();
                focusInput();

                if (activeCharPointer >= charIndices.length) {
                    checkParagraphCompletion();
                }
            }
        }

        function resetCurrentParagraph() {
            loadParagraph(currentParaIdx);
        }

        function togglePeekModal() {
            const modal = document.getElementById('modal-peek');
            modal.classList.toggle('hidden');
        }

        function checkParagraphCompletion() {
            const isAllSolved = parsedTokens.every(t => t.type === 'punct' || t.solved);
            if (!isAllSolved) return;

            const modal = document.getElementById('modal-transition');
            const card = document.getElementById('transition-card');
            const title = document.getElementById('transition-title');
            const sub = document.getElementById('transition-sub');
            const seal = document.getElementById('transition-seal');

            seal.textContent = totalMistakes === 0 ? '妙筆生花' : '熟能生巧';

            if (currentMode === 'sequential' && currentParaIdx < PARAGRAPHS.length - 1) {
                title.textContent = `恭喜成功背誦【第 ${PARAGRAPHS[currentParaIdx].id} 段】！`;
                sub.textContent = '詞句熟稔於心，即將進入下一段...';
            } else {
                title.textContent = '🎉 恭喜通關全部背默挑戰！';
                sub.textContent = '《岳陽樓記》三段精華已完全熟背，胸懷天下，喜洋洋矣！';
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');

            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                card.classList.add('scale-95');

                setTimeout(() => {
                    if (currentMode === 'sequential' && currentParaIdx < PARAGRAPHS.length - 1) {
                        currentParaIdx++;
                        loadParagraph(currentParaIdx);
                    } else {
                        showHomeScreen();
                    }
                }, 600);
            }, 2300);
        }

        // Register functions globally to prevent window reference issues
        window.startGameMode = startGameMode;
        window.showHomeScreen = showHomeScreen;
        window.toggleTimer = toggleTimer;
        window.resetTimer = resetTimer;
        window.triggerHint = triggerHint;
        window.resetCurrentParagraph = resetCurrentParagraph;
        window.togglePeekModal = togglePeekModal;
    </script>
</body>
</html>
